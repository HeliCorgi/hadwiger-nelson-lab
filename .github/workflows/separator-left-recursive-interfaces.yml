name: separator-left-recursive-interfaces

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-recursive-interfaces.yml'
      - 'tools/separator_left_recursive_interfaces.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_recursive_interfaces.py
      - name: Analyze recursive separator interfaces
        run: |
          mkdir -p results/separator-left-recursive-interfaces
          python tools/separator_left_recursive_interfaces.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-recursive-interfaces/analysis.json
      - name: Write summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/separator-left-recursive-interfaces/analysis.json').read_text())
          lines=['# Recursive interfaces for the three p-side equalities','']
          for t in d['targets']:
              lines.append(f"- `{t['pair'][0]}={t['pair'][1]}`: min cut **{t['min_vertex_cut_value']}**, separator `{t['separator_qnodes']}`, side sizes {t['u_component_size']} / {t['v_component_size']}, viable states `{t.get('viable_boundary_state_count')}`, all viable states force equality `{t.get('all_viable_states_force_equal')}`")
          Path('results/separator-left-recursive-interfaces/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-recursive-interfaces
          if ! git diff --cached --quiet; then
            git commit -m 'Record recursive left separator interfaces [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-recursive-interfaces-${{ github.run_id }}
          path: results/separator-left-recursive-interfaces
          if-no-files-found: error
          retention-days: 30
