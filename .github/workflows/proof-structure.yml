name: proof-structure

on:
  push:
    branches: [research/proof-structure]
    paths:
      - '.github/workflows/proof-structure.yml'
      - 'tools/proof_structure.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-structure
  cancel-in-progress: false

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  RESULT_DIR: results/proof-structure

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/proof-structure
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - name: Verify upstream pin
        run: test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile and proof-logging smoke test
        run: |
          python -m py_compile tools/proof_structure.py
          python - <<'PY'
          from pysat.solvers import Glucose4
          with Glucose4(bootstrap_with=[[1],[-1]], with_proof=True) as s:
              assert s.solve() is False
              assert s.get_proof() is not None
          print('Glucose4 DRUP logging: OK')
          PY
      - name: Normalize pinned verts file for analyzer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('upstream/handoff/data/verts.json')
          d = json.loads(p.read_text())
          if isinstance(d, dict):
              p.write_text(json.dumps(d['verts']))
          PY
      - name: Run quotient and proof analyses
        run: |
          mkdir -p "$RESULT_DIR"
          timeout --signal=TERM --kill-after=60s 9900s \
            python tools/proof_structure.py \
              --data-dir upstream/handoff/data \
              --out-dir "$RESULT_DIR" \
              --mode all \
              --max-candidates 300 \
              --max-support 6
      - name: Commit compact results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The raw DRUP proof is kept as an artifact; JSON analysis is committed.
          git add "$RESULT_DIR/SUMMARY.json" "$RESULT_DIR/quotient_analysis.json" "$RESULT_DIR/proof_interpolant_probe.json"
          if ! git diff --cached --quiet; then
            git commit -m "Record proof-structure analysis [skip ci]"
            git pull --rebase origin research/proof-structure
            git push origin HEAD:research/proof-structure
          fi
      - name: Upload proof and analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-structure-${{ github.run_id }}
          path: results/proof-structure
          if-no-files-found: error
          retention-days: 30
