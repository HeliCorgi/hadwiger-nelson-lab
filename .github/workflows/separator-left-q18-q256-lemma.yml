name: separator-left-q18-q256-lemma

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-q18-q256-lemma.yml'
      - 'tools/separator_left_q18_q256_lemma.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_q18_q256_lemma.py
      - name: Probe q18 != q256 lemma
        run: |
          mkdir -p results/separator-left-q18-q256-lemma
          python tools/separator_left_q18_q256_lemma.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-q18-q256-lemma/analysis.json
      - name: Write summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/separator-left-q18-q256-lemma/analysis.json').read_text())
          c=d['neighborhood_tests']['common']; u=d['neighborhood_tests']['union']; r=d['recursive_interface']
          lines=['# q18 != q256 local lemma probe','',
                 f"- forced different (two solvers): `{d['target_forced_different']}`",
                 f"- degrees: `{d['degrees']}`",
                 f"- common neighborhood: {c['vertex_count']} vertices; 4-colorable CaDiCaL/Glucose = {c['4colorable_cadical195']}/{c['4colorable_glucose4']}; K5={c['k5_clique']}",
                 f"- union neighborhood: {u['vertex_count']} vertices; 4-colorable CaDiCaL/Glucose = {u['4colorable_cadical195']}/{u['4colorable_glucose4']}; K5={u['k5_clique']}",
                 f"- recursive minimum cut: {r['min_vertex_cut_value']} on `{r['separator_qnodes']}`; side sizes {r['u_component_size']} / {r['v_component_size']}"]
          if 'inclusion_minimal_non4_vertex_count' in u:
              lines += [f"- inclusion-minimal non-4-colorable union-neighborhood core: **{u['inclusion_minimal_non4_vertex_count']} vertices / {u['inclusion_minimal_non4_edge_count']} edges**; K5={u['minimal_core_k5_clique']}"]
          if r.get('enumerated'):
              lines += [f"- recursive interface intersection states: **{r['intersection_count']}**; all force different={r['all_intersection_states_force_different']}"]
          Path('results/separator-left-q18-q256-lemma/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-q18-q256-lemma
          if ! git diff --cached --quiet; then
            git commit -m 'Record q18-q256 lemma probe [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-q18-q256-lemma-${{ github.run_id }}
          path: results/separator-left-q18-q256-lemma
          if-no-files-found: error
          retention-days: 30
