name: hn-center-graph-1200-chromatic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-center-graph-1200-chromatic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-center-geometry1200-34885574185
          path: /tmp/geom
          run-id: 34885574185
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Exact center graph chromatic probe
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_center_graph_chromatic.py \
            --library /tmp/geom/CENTER_LIBRARY.json \
            --out /tmp/out/CHROMATIC.json
      - uses: actions/upload-artifact@v7
        with:
          name: center-graph1200-chromatic-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
