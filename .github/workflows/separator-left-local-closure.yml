name: separator-left-local-closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-local-closure.yml'
      - 'tools/separator_left_local_closure.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_local_closure.py
      - name: Compute iterative local forcing closure
        run: |
          mkdir -p results/separator-left-local-closure
          python tools/separator_left_local_closure.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-local-closure/analysis.json
      - name: Write human-readable summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/separator-left-local-closure/analysis.json').read_text())
          lines=['# Separator left local forcing closure','',f"- rounds: **{d['round_count']}**",f"- final equality classes: **{d['final_class_count']}**",f"- all three target equalities proved by closure: **{d['all_targets_proved_by_closure']}**",'']
          for r in d['rounds']:
              lines.append(f"- round {r['round']}: {r['witness_count']} witnesses, {r['actual_merges']} merges, {r['classes_after']} classes remain")
          lines.append('')
          for t in d['targets']:
              lines.append(f"- target `{t['pair'][0]}={t['pair'][1]}`: proved={t['proved_by_closure']}; final class `{t['final_class']}`")
          Path('results/separator-left-local-closure/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-local-closure
          if ! git diff --cached --quiet; then
            git commit -m 'Record separator local forcing closure [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-local-closure-${{ github.run_id }}
          path: results/separator-left-local-closure
          if-no-files-found: error
          retention-days: 30
