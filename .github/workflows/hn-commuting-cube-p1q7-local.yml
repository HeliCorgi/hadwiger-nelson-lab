name: hn-commuting-cube-p1q7-local

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-commuting-cube-p1q7-local.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/commuting-cube-p1q7-local

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Rebuild p1q7 commuting cube
        run: |
          mkdir -p "$OUT_DIR"
          PYTHONPATH=tools python tools/hn_commuting_cube_geometry.py \
            --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT_DIR" --p 1 --q 7
      - name: Exact all-pairs completion
        run: |
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/SELECTED_GRAPH.json" --out "$OUT_DIR/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/POINTS.txt" > "$OUT_DIR/EXACT_EDGES.txt" 2> "$OUT_DIR/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/SELECTED_GRAPH.json" --edges "$OUT_DIR/EXACT_EDGES.txt" --out-dir "$OUT_DIR"
      - name: Independent validated local coloring
        run: |
          PYTHONPATH=tools python tools/hn_tabucol.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --out-dir "$OUT_DIR/tabucol" \
            --seconds 1800 --restarts 30 --iterations 2200000 --seed 2026091493 || true
      - name: Separate all pairs if coloring exists
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); p=root/'tabucol/TABUCOL.json'
          if not p.exists(): print('no local result'); sys.exit(0)
          d=json.loads(p.read_text())
          if d.get('status') not in ('SAT','FOUND') and d.get('classification')!='NOT_A':
              print('no validated coloring; B scan skipped'); sys.exit(0)
          cmd=[sys.executable,'tools/hn_local_pair_separation.py','--graph',str(root/'COMPLETED_GRAPH.json'),
               '--seed-coloring',str(p),'--out-dir',str(root/'separation'),
               '--seconds','3600','--pair-seconds','20','--iterations','850000',
               '--perturb','44','--max-failures','48','--seed','2026091494']
          env=dict(os.environ); env['PYTHONPATH']='tools'; subprocess.run(cmd,check=True,env=env)
          PY
      - name: Summarize
        if: always()
        run: |
          cp "$OUT_DIR/separation/SEPARATION.json" "$OUT_DIR/SEPARATION.json" 2>/dev/null || true
          cp "$OUT_DIR/separation/WITNESSES.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); lines=['# Independent local p1q7 cube control — 2026-09-14','']
          for label,name in [('geometry','GEOMETRY.json'),('tabucol','tabucol/TABUCOL.json'),('separation','SEPARATION.json')]:
              p=root/name
              if p.exists():
                  d=json.loads(p.read_text()); slim={k:v for k,v in d.items() if k not in ('colors','records','remaining_blocks','compressed_source_indices')}
                  lines += [f'## {label}','```json',json.dumps(slim,indent=2),'```','']
          lines += ['Any local-search failure is non-evidence. Any reported proper coloring is validated on the full exact edge set.']
          (root/'REPORT.md').write_text('\n'.join(lines)+'\n'); print((root/'REPORT.md').read_text())
          PY
      - name: Commit compact checkpoint
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "$OUT_DIR/REPORT.md" "$OUT_DIR/SUMMARY.json" "$OUT_DIR/GEOMETRY.json" \
                  "$OUT_DIR/tabucol/TABUCOL.json" "$OUT_DIR/SEPARATION.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Store independent p1q7 cube result'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-commuting-cube-p1q7-local-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          retention-days: 30
