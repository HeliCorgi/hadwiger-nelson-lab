name: hn-commuting-cube-p1q7-seeded

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-commuting-cube-p1q7-seeded.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/commuting-cube-p1q7-seeded

jobs:
  seeded:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Build cube and layer map
        run: |
          mkdir -p "$OUT_DIR"
          PYTHONPATH=tools python - <<'PY'
          import json,os
          from pathlib import Path
          from hn_exact import K2,ONE,unit_modulus
          from hn_closed_copy_assembly import build_ring,discover_exact_cross_edges
          from hn_linked_closed_orbits import pack
          from hn_three_orbit_network import rational_unit_rotation
          from hn_commuting_cube_geometry import inv_subfield,transform
          from hn_unconditional_scan import write_json
          root=Path(os.environ['OUT_DIR']); d=json.loads(Path('upstream/handoff/data/g510_k2.json').read_text())
          bp=[K2(x['a'],x['b'],x['den']) for x in d['pts']]; be=sorted({tuple(map(int,e)) for e in d['edges']})
          ring,inh,_=build_ring(bp,be,(95,101),3); re,_,_=discover_exact_cross_edges(ring,inh,3e-7); re=sorted(re)
          r1=rational_unit_rotation(1,3); r2=rational_unit_rotation(1,5); r3=rational_unit_rotation(1,7); s1=ring[0]-r1*ring[911]; center=inv_subfield(ONE-r1)*s1
          lower_rots=[ONE,r1,r2,r1*r2]; all_rots=lower_rots+[r3,r1*r3,r2*r3,r1*r2*r3]
          index={}; pts=[]; inherited=set()
          for r in all_rots:
              m=[]
              for p in transform(ring,r,center):
                  j=index.get(p)
                  if j is None: j=len(pts); index[p]=j; pts.append(p)
                  m.append(j)
              for u,v in re:
                  x,y=m[u],m[v]
                  if x!=y: inherited.add((min(x,y),max(x,y)))
          lower={}
          for r in lower_rots:
              for p in transform(ring,r,center):
                  if p not in lower: lower[p]=len(lower)
          ln=len(lower); assert ln==4742 and pts[:ln]==list(lower.keys())
          tmap=[index[r3*p+(ONE-r3)*center] for p in pts[:ln]]
          edges,_,_=discover_exact_cross_edges(pts,inherited,3e-7); assert all(unit_modulus(pts[u]-pts[v]) for u,v in edges)
          write_json(root/'SELECTED_GRAPH.json',{'pts':[pack(p) for p in pts],'edges':[list(e) for e in sorted(edges)]}); write_json(root/'LAYER_MAP.json',{'lower_n':ln,'t3map':tmap})
          PY
      - name: Exact all-pairs completion
        run: |
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/SELECTED_GRAPH.json" --out "$OUT_DIR/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/POINTS.txt" > "$OUT_DIR/EXACT_EDGES.txt" 2> "$OUT_DIR/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/SELECTED_GRAPH.json" --edges "$OUT_DIR/EXACT_EDGES.txt" --out-dir "$OUT_DIR"
      - name: Find minimum-conflict lifted square assignment
        run: |
          python - <<'PY'
          import itertools,json,os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); g=json.loads((root/'COMPLETED_GRAPH.json').read_text()); m=json.loads((root/'LAYER_MAP.json').read_text()); ws=json.loads(Path('results/unconditional-2026-09-14/commuting-square-control/WITNESSES.json').read_text())['models']
          n=len(g['pts']); edges=[tuple(e) for e in g['edges']]; ln=m['lower_n']; tmap=m['t3map']; best=None; tested=0
          for wi,c in enumerate(ws):
              for perm in itertools.permutations(range(5)):
                  tested+=1; colors=[-1]*n; ok=True
                  for i,x in enumerate(c): colors[i]=x
                  for i,x in enumerate(c):
                      j=tmap[i]; y=perm[x]
                      if colors[j]>=0 and colors[j]!=y: ok=False; break
                      colors[j]=y
                  if not ok or any(x<0 for x in colors): continue
                  conf=sum(1 for u,v in edges if colors[u]==colors[v])
                  if best is None or conf<best[0]:
                      best=(conf,wi,list(perm),colors); print(json.dumps({'tested':tested,'best_conflicts':conf,'witness_index':wi,'permutation':list(perm)}),flush=True)
                      if conf==0: break
              if best and best[0]==0: break
          assert best is not None
          conf,wi,perm,colors=best; (root/'BEST_LIFTED_COLORING.txt').write_text(''.join(map(str,colors))+'\n'); (root/'BEST_LIFTED.json').write_text(json.dumps({'tested':tested,'best_conflicts':conf,'witness_index':wi,'permutation':perm},indent=2)+'\n')
          PY
      - name: Repair best lifted assignment
        run: |
          PYTHONPATH=tools python tools/hn_seeded_tabucol.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --seed-coloring "$OUT_DIR/BEST_LIFTED_COLORING.txt" \
            --out-dir "$OUT_DIR/seeded" --seconds 1800 --restarts 24 --iterations 2200000 \
            --perturb 60 --seed 2026091495 || true
      - name: Separate all pairs if repaired
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); p=root/'seeded/SEEDED_TABUCOL.json'
          if not p.exists() or json.loads(p.read_text()).get('classification')!='NOT_A': print('no validated repair; skip B'); sys.exit(0)
          cmd=[sys.executable,'tools/hn_local_pair_separation.py','--graph',str(root/'COMPLETED_GRAPH.json'),'--seed-coloring',str(p),'--out-dir',str(root/'separation'),'--seconds','3000','--pair-seconds','20','--iterations','850000','--perturb','44','--max-failures','48','--seed','2026091496']
          env=dict(os.environ); env['PYTHONPATH']='tools'; subprocess.run(cmd,check=True,env=env)
          PY
      - name: Summarize
        if: always()
        run: |
          cp "$OUT_DIR/separation/SEPARATION.json" "$OUT_DIR/SEPARATION.json" 2>/dev/null || true
          cp "$OUT_DIR/separation/WITNESSES.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); lines=['# Seeded p1q7 cube repair — 2026-09-14','']
          for label,name in [('geometry','GEOMETRY.json'),('best lifted','BEST_LIFTED.json'),('seeded repair','seeded/SEEDED_TABUCOL.json'),('separation','SEPARATION.json')]:
              p=root/name
              if p.exists():
                  d=json.loads(p.read_text()); slim={k:v for k,v in d.items() if k not in ('colors','records','remaining_blocks','compressed_source_indices')}; lines += [f'## {label}','```json',json.dumps(slim,indent=2),'```','']
          lines += ['Failure of the lifted family or heuristic repair is non-evidence; any successful coloring is fully edge-validated.']
          (root/'REPORT.md').write_text('\n'.join(lines)+'\n'); print((root/'REPORT.md').read_text())
          PY
      - name: Commit compact checkpoint
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git pull --rebase origin main
          git add "$OUT_DIR/REPORT.md" "$OUT_DIR/GEOMETRY.json" "$OUT_DIR/BEST_LIFTED.json" "$OUT_DIR/seeded/SEEDED_TABUCOL.json" "$OUT_DIR/SEPARATION.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'Store seeded p1q7 cube result'; git push origin HEAD:main; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-cube-p1q7-seeded-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          retention-days: 30
