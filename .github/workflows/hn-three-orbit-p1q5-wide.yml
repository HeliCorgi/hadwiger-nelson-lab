name: hn-three-orbit-p1q5-wide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-three-orbit-p1q5-wide.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/three-orbit-p1q5-wide

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Wide exact p1q5 coupling screen
        run: |
          mkdir -p "$OUT_DIR"
          PYTHONPATH=tools python tools/hn_three_orbit_rotation_geometry.py --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT_DIR" --c-p 1 --c-q 5 --pivot-count 12 --seed 2026091470
      - name: Commit census
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "$OUT_DIR/SUMMARY.json"
          if ! git diff --cached --quiet; then
            git commit -m 'Store wide p1q5 coupling census'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: hn-three-orbit-p1q5-wide-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          retention-days: 30
