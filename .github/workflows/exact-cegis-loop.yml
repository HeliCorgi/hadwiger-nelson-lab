name: exact-cegis-loop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/exact-cegis-loop.yml'
      - '.github/exact-cegis-loop.trigger'

permissions:
  contents: write
  actions: read

concurrency:
  group: exact-cegis-loop
  cancel-in-progress: false

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  CHECKPOINT: checkpoints/semantic_portfree_s4.json.gz
  ROOT: results/exact-cegis-loop

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout pinned upstream handoff
        uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile tools and validate checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          gzip -t "$CHECKPOINT"
          python -m py_compile \
            tools/exact_fourset_master.py \
            tools/check_fourset_candidate.py \
            tools/append_semantic_fooling_pair.py
          python tools/exact_fourset_master.py --self-test

      - name: Run exact CEGIS loop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/history" "$ROOT/master-current"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          persist_progress() {
            local message="$1"
            git add "$CHECKPOINT" "$ROOT" || true
            if ! git diff --cached --quiet; then
              git commit -m "$message [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }

          # Leave roughly 30 minutes before the 330-minute job timeout for a
          # clean exit, persistence, artifact upload, and Actions post-steps.
          safe_deadline=$((SECONDS + 18000))

          # Consume the already independently checked first candidate if this
          # checkpoint has not yet seen its fooling-pair witness. The append
          # tool is duplicate-safe, so current checkpoints make this a no-op.
          if [[ -f results/fourset-candidate-check/analysis.json ]]; then
            status=$(python - <<'PY'
          import json
          print(json.load(open('results/fourset-candidate-check/analysis.json'))['status'])
          PY
          )
            if [[ "$status" == "SAT-FOOLING-PAIR" ]]; then
              python tools/append_semantic_fooling_pair.py \
                --data-dir upstream/handoff/data \
                --checkpoint "$CHECKPOINT" \
                --oracle-result results/fourset-candidate-check/analysis.json
            fi
          fi

          for loop in $(seq 1 400); do
            # A full exact-master slice may take about 15 minutes. Do not start
            # one unless enough guarded time remains.
            if (( SECONDS + 1000 >= safe_deadline )); then
              echo "safe workflow deadline reached before iteration $loop"
              persist_progress 'Checkpoint exact semantic CEGIS safe stop'
              break
            fi

            echo "=== exact CEGIS iteration $loop ==="
            set +e
            timeout --signal=TERM --kill-after=30s 930s \
              python tools/exact_fourset_master.py \
                --data-dir upstream/handoff/data \
                --checkpoint "$CHECKPOINT" \
                --result-dir "$ROOT/master-current" \
                --time-limit-sec 870 \
                --lookahead-cuts 32
            rc=$?
            set -e

            case "$rc" in
              0|75|124|137|143) ;;
              *) echo "unexpected exact-master exit code $rc"; exit "$rc" ;;
            esac

            if [[ -f "$ROOT/master-current/FINAL.json" ]]; then
              cp "$ROOT/master-current/FINAL.json" "$ROOT/MASTER_FINAL.json"
              echo "terminal exact-master result produced"
              persist_progress 'Checkpoint terminal exact-master result'
              break
            fi

            if [[ -f "$ROOT/master-current/CANDIDATE.json" ]]; then
              mapfile -t support < <(python - <<'PY'
          import json
          d=json.load(open('results/exact-cegis-loop/master-current/CANDIDATE.json'))
          for v in d['support_vertices']:
              print(v)
          PY
          )
              if [[ "${#support[@]}" -ne 4 ]]; then
                echo "bad candidate support"; exit 2
              fi

              oracle_tmp="/tmp/semantic-$loop.json"
              python tools/check_fourset_candidate.py \
                --data-dir upstream/handoff/data \
                --result "$oracle_tmp" \
                --support "${support[@]}"

              lab_iter=$(python - <<'PY'
          import gzip,json
          with gzip.open('checkpoints/semantic_portfree_s4.json.gz','rt') as f:
              print(json.load(f)['iterations'])
          PY
          )
              cp "$ROOT/master-current/CANDIDATE.json" \
                "$ROOT/history/master-before-${lab_iter}.json"
              cp "$oracle_tmp" "$ROOT/history/oracle-${lab_iter}.json"

              oracle_status=$(python - "$oracle_tmp" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['status'])
          PY
          )
              echo "oracle status=$oracle_status support=${support[*]}"

              if [[ "$oracle_status" == "SAT-FOOLING-PAIR" ]]; then
                python tools/append_semantic_fooling_pair.py \
                  --data-dir upstream/handoff/data \
                  --checkpoint "$CHECKPOINT" \
                  --oracle-result "$oracle_tmp"
                rm -rf "$ROOT/master-current"
                mkdir -p "$ROOT/master-current"
                if (( loop % 5 == 0 )); then
                  persist_progress "Checkpoint exact semantic CEGIS iteration $loop"
                fi
                continue
              elif [[ "$oracle_status" == "UNSAT-INTERFACE-CANDIDATE" ]]; then
                cp "$oracle_tmp" "$ROOT/INTERFACE_CANDIDATE.json"
                echo "terminal semantic interface candidate produced"
                persist_progress 'Checkpoint semantic interface candidate'
                break
              else
                cp "$oracle_tmp" "$ROOT/ORACLE_ERROR.json"
                persist_progress 'Checkpoint semantic oracle error'
                exit 2
              fi
            fi

            # Exit code 75 is the exact master's own safe time-slice boundary.
            # STATE.json is resumable, so keep using the remaining workflow
            # budget instead of ending the whole job after one 15-minute slice.
            if [[ "$rc" == "75" ]]; then
              echo "safe exact-master slice ended; persist and continue from STATE.json"
              persist_progress 'Checkpoint nonterminal exact-master slice'
              continue
            fi

            # Outer timeout / kill codes are emergency guards, not certified
            # resumable boundaries. Persist whatever is valid and stop rather
            # than assuming the interrupted process wrote a complete state.
            if [[ "$rc" == "124" || "$rc" == "137" || "$rc" == "143" ]]; then
              echo "outer timeout/signal ended exact master; stopping defensively"
              persist_progress 'Checkpoint guarded exact-master stop'
              break
            fi

            echo "exact master returned without candidate/final; stopping defensively"
            persist_progress 'Checkpoint defensive exact CEGIS stop'
            break
          done

          gzip -t "$CHECKPOINT"
          python - <<'PY'
          import gzip,json
          with gzip.open('checkpoints/semantic_portfree_s4.json.gz','rt') as f:
              d=json.load(f)
          print('durable lab iterations',d['iterations'],'total cuts',d['iterations']+872,'status',d['status'])
          PY
          persist_progress 'Checkpoint exact semantic CEGIS loop final state'

      - name: Write human-readable status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          python - <<'PY'
          import gzip, json, os
          from pathlib import Path

          root = Path('results/exact-cegis-loop')
          lines = ['# Exact CEGIS status', '']

          checkpoint = Path('checkpoints/semantic_portfree_s4.json.gz')
          if checkpoint.exists():
              with gzip.open(checkpoint, 'rt', encoding='utf-8') as f:
                  cp = json.load(f)
              lab = int(cp.get('iterations', 0))
              lines += [
                  f'- Lab fooling pairs: **{lab}**',
                  f'- Total sound fooling pairs/cuts before dedup: **{lab + 872}**',
                  f'- Checkpoint status: `{cp.get("status")}`',
              ]

          state_path = root / 'master-current' / 'STATE.json'
          if state_path.exists():
              st = json.loads(state_path.read_text(encoding='utf-8'))
              nxt = st.get('next_root_rank')
              total = st.get('pivot_root_edge_count')
              lines += [
                  f'- Exact-master state: `{st.get("status")}`',
                  f'- Unique cuts: **{st.get("unique_cut_count")}**',
                  f'- Duplicate cuts: **{st.get("duplicate_cut_count")}**',
                  f'- Root rank: **{nxt} / {total}** (rank count only; not a runtime-completion percentage)',
                  f'- Pivot source: `{st.get("pivot_cut_source")}`',
                  f'- Cut-library SHA256: `{st.get("cut_library_sha256")}`',
              ]

          if (root / 'INTERFACE_CANDIDATE.json').exists():
              lines += ['', '**Terminal event:** semantic support-4 interface candidate found; independent verification required.']
          elif (root / 'MASTER_FINAL.json').exists():
              lines += ['', '**Terminal event:** exact four-set master exhausted; independent verification required before theorem promotion.']
          elif (root / 'ORACLE_ERROR.json').exists():
              lines += ['', '**Terminal event:** semantic oracle error.']
          else:
              lines += ['', 'No mathematical terminal event is recorded; this state is resumable.']

          text = '\n'.join(lines) + '\n'
          (root / 'STATUS.md').write_text(text, encoding='utf-8')
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write(text)
          print(text)
          PY

      - name: Persist checkpoint and loop state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CHECKPOINT" "$ROOT" || true
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint exact semantic CEGIS loop [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload loop state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-cegis-loop-${{ github.run_id }}
          path: |
            checkpoints/semantic_portfree_s4.json.gz
            results/exact-cegis-loop
          if-no-files-found: warn
          retention-days: 30
