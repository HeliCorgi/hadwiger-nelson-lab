name: hn-cube-p1q7-overlap-only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-cube-p1q7-overlap-only.yml'
  workflow_dispatch:

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        solver: [cadical195, glucose4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Build overlap-only two-square exact subgraph
        run: |
          OUT="results/unconditional-2026-09-14/cube-p1q7-overlap-only-${{ matrix.solver }}"
          mkdir -p "$OUT"
          PYTHONPATH=tools python - <<'PY'
          import json,os
          from pathlib import Path
          from hn_exact import K2,ONE,unit_modulus
          from hn_closed_copy_assembly import build_ring,discover_exact_cross_edges
          from hn_three_orbit_network import rational_unit_rotation
          from hn_commuting_cube_geometry import inv_subfield,transform
          from hn_linked_closed_orbits import pack
          from hn_unconditional_scan import write_json
          solver=os.environ['MATRIX_SOLVER']; out=Path(f'results/unconditional-2026-09-14/cube-p1q7-overlap-only-{solver}')
          d=json.loads(Path('upstream/handoff/data/g510_k2.json').read_text()); bp=[K2(x['a'],x['b'],x['den']) for x in d['pts']]; be=sorted({tuple(map(int,e)) for e in d['edges']})
          ring,inh,_=build_ring(bp,be,(95,101),3); re,_,_=discover_exact_cross_edges(ring,inh,3e-7); re=sorted(re)
          r1=rational_unit_rotation(1,3); r2=rational_unit_rotation(1,5); r3=rational_unit_rotation(1,7); s1=ring[0]-r1*ring[911]; center=inv_subfield(ONE-r1)*s1
          sq_rots=[ONE,r1,r2,r1*r2]; index={}; pts=[]; lower_maps=[]; lower_inh=set()
          for r in sq_rots:
              m=[]
              for p in transform(ring,r,center):
                  j=index.get(p)
                  if j is None: j=len(pts); index[p]=j; pts.append(p)
                  m.append(j)
              lower_maps.append(m)
              for u,v in re:
                  x,y=m[u],m[v]
                  if x!=y: lower_inh.add((min(x,y),max(x,y)))
          lower_edges,_,_=discover_exact_cross_edges(pts,lower_inh,3e-7); lower_edges=sorted(lower_edges); assert len(pts)==4742 and len(lower_edges)==28459
          lower_pts=list(pts); upper_map=[]
          for p in lower_pts:
              q=r3*p+(ONE-r3)*center; j=index.get(q)
              if j is None: j=len(pts); index[q]=j; pts.append(q)
              upper_map.append(j)
          edges=set(lower_edges)
          for u,v in lower_edges:
              x,y=upper_map[u],upper_map[v]
              if x!=y: edges.add((min(x,y),max(x,y)))
          overlap=sum(1 for j in upper_map if j<4742)
          assert len(pts)==9369 and overlap==115 and len(edges)==56602
          assert all(unit_modulus(pts[u]-pts[v]) for u,v in edges)
          graph={'pts':[pack(p) for p in pts],'edges':[list(e) for e in sorted(edges)],'construction':'two exact commuting-square copies related by r(1/7), retaining only within-square exact unit edges; 115 shared points','all_saved_edges_exact_unit':True,'overlap_vertices':overlap,'omitted_interlayer_unit_edges':886}
          write_json(out/'GRAPH.json',graph); write_json(out/'SUMMARY.json',{'vertices':len(pts),'edges':len(edges),'lower_square_edges':len(lower_edges),'shared_vertices':overlap,'omitted_interlayer_unit_edges':886,'all_edges_exact_unit':True})
          PY
        env:
          MATRIX_SOLVER: ${{ matrix.solver }}
      - name: Full unbudgeted solve
        run: |
          OUT="results/unconditional-2026-09-14/cube-p1q7-overlap-only-${{ matrix.solver }}"
          PYTHONPATH=tools python tools/hn_full_sat_probe.py --graph "$OUT/GRAPH.json" --out-dir "$OUT/solve" --solver "${{ matrix.solver }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-overlap-only-${{ matrix.solver }}-${{ github.run_id }}
          path: results/unconditional-2026-09-14/cube-p1q7-overlap-only-${{ matrix.solver }}
          retention-days: 30
