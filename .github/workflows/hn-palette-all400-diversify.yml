name: hn-palette-all400-diversify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-palette-all400-diversify.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diversify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-layer400-all-34882939861
          path: /tmp/all400
          run-id: 34882939861
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Diversify validated all400 coloring
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_diversify_colorings.py \
            --graph /tmp/all400/build/GRAPH.json \
            --seed-coloring /tmp/all400/repair/COLORING.txt \
            --out-dir /tmp/out \
            --models 30 \
            --seconds 6000 \
            --repair-seconds 90 \
            --iterations 1000000 \
            --perturb-min 20 \
            --perturb-max 220 \
            --seed 20260915400
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-all400-diverse-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
