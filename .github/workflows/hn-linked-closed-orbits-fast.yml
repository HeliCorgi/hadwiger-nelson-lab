name: hn-linked-closed-orbits-fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-linked-closed-orbits-fast.yml'
      - 'tools/hn_linked_closed_orbits_fast.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/linked-closed-orbits-fast

jobs:
  fast-control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Optimized geometry-only linked-orbit selection
        run: |
          mkdir -p "$OUT_DIR"
          PYTHONPATH=tools python tools/hn_linked_closed_orbits_fast.py \
            --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT_DIR" \
            --ring-order 3 --ring-anchor 95,101 --pivot-count 4 --seed 20260914
      - name: Exact all-pairs completion
        run: |
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/SELECTED_GRAPH.json" --out "$OUT_DIR/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/POINTS.txt" > "$OUT_DIR/EXACT_EDGES.txt" 2> "$OUT_DIR/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/SELECTED_GRAPH.json" --edges "$OUT_DIR/EXACT_EDGES.txt" --out-dir "$OUT_DIR"
      - name: Validated local 5-color witness search
        run: |
          PYTHONPATH=tools python tools/hn_tabucol.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --out-dir "$OUT_DIR/tabucol" \
            --seconds 600 --restarts 12 --iterations 1000000 --seed 2026091405 || true
      - name: Sound symmetry SAT probe
        run: |
          PYTHONPATH=tools python tools/hn_symmetry_sat_probe.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --out-dir "$OUT_DIR/symmetry" \
            --conflicts 1500000 --attempts 5 --seed 2026091406
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR'])
          lines=['# Fast asymmetric linked-orbit control — 2026-09-14','']
          for name in ('SELECTED.json','GEOMETRY.json','tabucol/TABUCOL.json','symmetry/SYMMETRY_SAT.json'):
              p=root/name
              if p.exists():
                  d=json.loads(p.read_text())
                  lines += [f'## {name}','```json',json.dumps({k:v for k,v in d.items() if k not in ('colors','records')},indent=2),'```','']
          lines += ['This run screens only 16 pivot alignments and selects by exact cross-orbit edge count. It is a concrete fast control, not an exhaustive linker search or the final portfolio objective. UNKNOWN/local-search failure is non-evidence.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print((root/'SUMMARY.md').read_text())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-linked-closed-orbits-fast-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30
