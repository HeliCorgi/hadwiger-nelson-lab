name: hn-affine-seeded-fork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hn-affine-seeded-fork.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        multiplier: [1, 4]
        solver: [cadical195, glucose4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install python-sat==1.9.dev7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: affine-rhombus-fork-cadical195-35057449450
          run-id: 35057449450
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/parent
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: affine-rhombus-u-cadical195-35057449450
          run-id: 35057449450
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/seed
      - name: Test seed transformation and affine encoding
        run: PYTHONPATH=tools python -m unittest discover -s tools -p 'test_hn_affine*.py' -v
      - name: Use soft preferences only and check the full original graph
        env:
          MULTIPLIER: ${{ matrix.multiplier }}
          SOLVER: ${{ matrix.solver }}
        run: |
          mkdir -p /tmp/output
          echo '${{ github.sha }}' > /tmp/output/SOURCE_COMMIT.txt
          python tools/hn_affine_seeded_fork.py --parent /tmp/parent --seed /tmp/seed --out /tmp/output \
            --multiplier "$MULTIPLIER" --solver "$SOLVER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: affine-seeded-fork-${{ matrix.multiplier }}-${{ matrix.solver }}-${{ github.run_id }}
          path: /tmp/output
          retention-days: 90
