name: hn-center-list-escape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-center-list-escape.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-center-geometry1200-34885574185
          path: /tmp/geom
          run-id: 34885574185
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          name: palette-layer1200-repair-34887160185
          path: /tmp/repair
          run-id: 34887160185
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Exact fixed-base three-color escape MaxSAT
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_center_list_escape_maxsat.py \
            --library /tmp/geom/CENTER_LIBRARY.json \
            --base-coloring /tmp/repair/COLORING.txt \
            --base-vertices 9369 \
            --out /tmp/out/LIST_ESCAPE.json
      - uses: actions/upload-artifact@v7
        with:
          name: center-list-escape-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
