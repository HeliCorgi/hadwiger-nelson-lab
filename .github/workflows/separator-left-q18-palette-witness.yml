name: separator-left-q18-palette-witness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-q18-palette-witness.yml'
      - 'tools/separator_left_q18_palette_witness.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_q18_palette_witness.py
      - name: Search palette witness
        run: |
          mkdir -p results/separator-left-q18-palette-witness
          python tools/separator_left_q18_palette_witness.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-q18-palette-witness/analysis.json
      - name: Write summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/separator-left-q18-palette-witness/analysis.json').read_text())
          lines=['# q18-side palette-containment witness','',
                 f"- anchor equality-class sizes: `{ {k:len(v) for k,v in d['anchor_equality_classes'].items()} }`",
                 f"- raw common fifth-color witnesses: `{[x['vertex'] for x in d['raw_conditional_common_neighbors']]}`; witness edges `{d['raw_witness_edges']}`",
                 f"- equality-class common fifth-color witnesses: `{[x['vertex'] for x in d['equality_class_conditional_common_neighbors']]}`; witness edges `{d['equality_class_witness_edges']}`",
                 f"- raw adjacent-witness proof exists: **{d['has_raw_two_adjacent_fifth_color_witnesses']}**",
                 f"- equality-class adjacent-witness proof exists: **{d['has_eqclass_two_adjacent_fifth_color_witnesses']}**",
                 f"- solver cross-check: {d['solver_crosscheck']}"]
          Path('results/separator-left-q18-palette-witness/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-q18-palette-witness
          if ! git diff --cached --quiet; then
            git commit -m 'Record q18 palette witness scan [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-q18-palette-witness-${{ github.run_id }}
          path: results/separator-left-q18-palette-witness
          if-no-files-found: error
          retention-days: 30
