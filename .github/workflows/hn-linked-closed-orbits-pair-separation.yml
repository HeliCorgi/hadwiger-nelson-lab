name: hn-linked-closed-orbits-pair-separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-linked-closed-orbits-pair-separation.yml'
      - 'tools/hn_linked_closed_orbits_direct.py'
      - 'tools/hn_sample_colorings.py'
      - 'tools/hn_pair_separation_from_models.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  EXPECTED_SEMANTIC_SHA256: 866590e7d7b61e10fd59d551dfa98ce73c98532c79364068ee073ce3d947fc06
  OUT_DIR: results/unconditional-2026-09-14/linked-closed-orbits-pair-separation

jobs:
  separation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Rebuild fixed linked-orbit candidate
        run: |
          mkdir -p "$OUT_DIR"
          PYTHONPATH=tools python tools/hn_linked_closed_orbits_direct.py \
            --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT_DIR" \
            --ring-order 3 --ring-anchor 95,101 --dst-pivot 0 --src-pivot 911
      - name: Exact all-pairs completion
        run: |
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/SELECTED_GRAPH.json" --out "$OUT_DIR/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/POINTS.txt" > "$OUT_DIR/EXACT_EDGES.txt" 2> "$OUT_DIR/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/SELECTED_GRAPH.json" --edges "$OUT_DIR/EXACT_EDGES.txt" --out-dir "$OUT_DIR"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR'])
          d=json.loads((root/'GEOMETRY.json').read_text())
          g=json.loads((root/'COMPLETED_GRAPH.json').read_text())
          semantic=hashlib.sha256(json.dumps({'pts':g['pts'],'edges':g['edges']},separators=(',',':')).encode()).hexdigest()
          assert semantic==os.environ['EXPECTED_SEMANTIC_SHA256'], (semantic,d)
          assert d['vertices']==2373 and d['exact_induced_edges']==14178
          assert d['new_edges_from_exact_completion']==0
          d['semantic_pts_edges_sha256']=semantic
          (root/'GEOMETRY.json').write_text(json.dumps(d,indent=2)+'\n')
          print('pinned semantic graph verified',semantic)
          PY
      - name: Generate diverse validated colorings
        run: |
          PYTHONPATH=tools python tools/hn_sample_colorings.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --out-dir "$OUT_DIR/models" \
            --models 16 --conflicts 800000 --seed 2026091410
      - name: Close residual same-signature pairs
        run: |
          PYTHONPATH=tools python tools/hn_pair_separation_from_models.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --models "$OUT_DIR/models/MODELS.json" \
            --out-dir "$OUT_DIR/separation" --seconds 1200 --pair-seconds 20 \
            --iterations 500000 --perturb 28 --max-failures 20 --seed 2026091411
      - name: Summarize
        if: always()
        run: |
          cp "$OUT_DIR/separation/SEPARATION.json" "$OUT_DIR/SEPARATION.json" 2>/dev/null || true
          cp "$OUT_DIR/separation/WITNESSES.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR'])
          lines=['# Asymmetric linked closed-orbit pair separation — 2026-09-14','',
                 'Fixed candidate: order-3 ring anchor `(95,101)`, asymmetric rotation `(-1+3*sqrt(-11))/10`, pivot link `(dst,src)=(0,911)`.','']
          for label,name in [('geometry','GEOMETRY.json'),('sampled colorings','models/STATS.json'),('pair separation','SEPARATION.json')]:
              p=root/name
              if p.exists():
                  d=json.loads(p.read_text())
                  slim={k:v for k,v in d.items() if k not in ('remaining_blocks','records','compressed_source_indices')}
                  lines += [f'## {label}','```json',json.dumps(slim,indent=2),'```','']
          lines += ['Every retained coloring is validated on every exact edge. Timeout or failed repair is non-evidence.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print((root/'SUMMARY.md').read_text())
          PY
      - name: Commit compact checkpoint
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "$OUT_DIR/SUMMARY.md" "$OUT_DIR/SELECTED.json" "$OUT_DIR/GEOMETRY.json" \
                  "$OUT_DIR/models/STATS.json" "$OUT_DIR/SEPARATION.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Store linked-orbit pair-separation checkpoint'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-linked-closed-orbits-pair-separation-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30
