name: hn-cube-p1q7-residual-pair-sat-wave2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-cube-p1q7-residual-pair-sat-wave2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: p1q7-residual-sat-input-34853416283
          path: /tmp/input
          run-id: 34853416283
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Incremental exact residual separation
        run: |
          mkdir -p /tmp/incremental
          PYTHONPATH=tools python tools/hn_full_sat_probe.py \
            --graph /tmp/input/COMPLETED_GRAPH.json \
            --seed-coloring /tmp/input/SEED_COLORING.txt \
            --witnesses results/unconditional-2026-09-14/commuting-cube-p1q7/WITNESSES.json \
            --iterate-pairs 20 \
            --solver cadical195 \
            --out-dir /tmp/incremental
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p1q7-incremental-${{ github.run_id }}
          path: /tmp/incremental
          retention-days: 30
