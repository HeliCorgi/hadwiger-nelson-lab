name: hn-affine-rhombus
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hn-affine-rhombus.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [u, fork]
        solver: [cadical195, glucose4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install numpy==1.26.4 sympy==1.14.0 python-sat==1.9.dev7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: translation-resume-${{ matrix.case }}-cadical195-35049612048
          run-id: 35049612048
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/parent
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: phi-rhombus-geometry-35009411746
          run-id: 35009411746
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/rhombus
      - name: Exhaustive small-instance regression tests
        run: PYTHONPATH=tools python -m unittest discover -s tools -p test_hn_affine_copy.py -v
      - name: Independently audit original geometry
        run: |
          mkdir -p /tmp/output
          echo '${{ github.sha }}' > /tmp/output/SOURCE_COMMIT.txt
          python tools/hn_cyclotomic210_independent_audit.py --graph /tmp/parent/GRAPH.json --out /tmp/output/INDEPENDENT_GEOMETRY.json
      - name: Probe source-level affine templates and validate original edges
        env:
          CASE: ${{ matrix.case }}
          SOLVER: ${{ matrix.solver }}
        run: |
          python tools/hn_affine_rhombus_run.py --parent /tmp/parent --rhombus /tmp/rhombus/same \
            --case "$CASE" --solver "$SOLVER" --seconds 60 --out /tmp/output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: affine-rhombus-${{ matrix.case }}-${{ matrix.solver }}-${{ github.run_id }}
          path: /tmp/output
          retention-days: 90
