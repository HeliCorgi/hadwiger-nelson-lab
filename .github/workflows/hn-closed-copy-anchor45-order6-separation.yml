name: hn-closed-copy-anchor45-order6-separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-closed-copy-anchor45-order6-separation.yml'
      - 'tools/hn_local_pair_separation.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/closed-copy-anchor45-order6-separation

jobs:
  separation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Build exact order-6 candidate
        run: |
          mkdir -p "$OUT_DIR"
          PYTHONPATH=tools python tools/hn_closed_copy_direct.py \
            --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT_DIR" \
            --order 6 --anchor 45,173
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/SELECTED_GRAPH.json" --out "$OUT_DIR/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/POINTS.txt" > "$OUT_DIR/EXACT_EDGES.txt" 2> "$OUT_DIR/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/SELECTED_GRAPH.json" --edges "$OUT_DIR/EXACT_EDGES.txt" --out-dir "$OUT_DIR"
      - name: Obtain validated seed coloring
        run: |
          PYTHONPATH=tools python tools/hn_tabucol.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --out-dir "$OUT_DIR/seed" \
            --seconds 600 --restarts 12 --iterations 1000000 --seed 20260914
          test -s "$OUT_DIR/seed/COLORING.txt"
      - name: Target residual same-color pairs with local repair
        run: |
          PYTHONPATH=tools python tools/hn_local_pair_separation.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" \
            --seed-coloring "$OUT_DIR/seed/COLORING.txt" \
            --out-dir "$OUT_DIR/separation" \
            --seconds 1500 --pair-seconds 24 --iterations 500000 \
            --perturb 28 --max-failures 18 --seed 2026091402
      - name: Summarize
        if: always()
        run: |
          cp "$OUT_DIR/separation/SEPARATION.json" "$OUT_DIR/SEPARATION.json" 2>/dev/null || true
          cp "$OUT_DIR/separation/WITNESSES.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR'])
          lines=['# Closed copy anchor45 order6 targeted pair separation — 2026-09-14','']
          for name in ('GEOMETRY.json','SEPARATION.json'):
              p=root/name
              if p.exists():
                  d=json.loads(p.read_text())
                  lines.append(f'## {name}')
                  lines.append('```json')
                  slim={k:v for k,v in d.items() if k not in ('remaining_blocks','records')}
                  lines.append(json.dumps(slim,indent=2))
                  lines.append('```')
          lines += ['', 'Every retained coloring is validated on every exact edge. Local-repair failure or timeout is non-evidence.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print((root/'SUMMARY.md').read_text())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-closed-copy-anchor45-order6-separation-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30
