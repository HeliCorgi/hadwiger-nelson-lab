name: quotient-critical
on:
  push:
    branches: [research/quotient-critical]
    paths:
      - '.github/workflows/quotient-critical.yml'
      - 'tools/quotient_critical.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quotient-critical
  cancel-in-progress: false
env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/quotient-critical
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/quotient_critical.py
      - name: Analyze critical quotient
        run: |
          mkdir -p results/quotient-critical
          timeout --signal=TERM --kill-after=30s 3000s python tools/quotient_critical.py \
            --data-dir upstream/handoff/data \
            --out results/quotient-critical/analysis.json
      - name: Commit result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/quotient-critical/analysis.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record quotient critical-graph analysis [skip ci]'
            git push origin HEAD:research/quotient-critical
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quotient-critical-${{ github.run_id }}
          path: results/quotient-critical
          if-no-files-found: error
          retention-days: 30
