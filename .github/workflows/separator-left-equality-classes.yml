name: separator-left-equality-classes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-equality-classes.yml'
      - 'tools/separator_left_equality_classes.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_equality_classes.py
      - name: Scan forced-equality classes and local chains
        run: |
          mkdir -p results/separator-left-equality-classes
          python tools/separator_left_equality_classes.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-equality-classes/analysis.json
      - name: Write summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/separator-left-equality-classes/analysis.json')
          d=json.loads(p.read_text())
          lines=['# Separator left equality classes','']
          for t in d['targets']:
              lines.append(f"- `{t['target_pair'][0]}={t['target_pair'][1]}`: equality class size **{t['equality_class_size']}**, local common-neighborhood forcing edges **{t['local_forcing_edge_count']}**, shortest local chain `{t['shortest_local_forcing_path']}`")
          lines += ['', '- solver cross-check: CaDiCaL195 and Glucose4 equality classes agree exactly.']
          Path('results/separator-left-equality-classes/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-equality-classes
          if ! git diff --cached --quiet; then
            git commit -m 'Record separator left equality classes [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-equality-classes-${{ github.run_id }}
          path: results/separator-left-equality-classes
          if-no-files-found: error
          retention-days: 30
