name: hn-palette-center-geometry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-palette-center-geometry.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: p1q7-residual-sat-input-34853416283
          path: /tmp/input
          run-id: 34853416283
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Coupled center geometry census
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_palette_center_geometry.py \
            --graph /tmp/input/COMPLETED_GRAPH.json \
            --witnesses results/unconditional-2026-09-14/commuting-cube-p1q7/WITNESSES.json \
            --direction-vertices 1192 \
            --candidate-count 160 \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-center-geometry-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
