name: hn-commuting-square-control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-commuting-square-control.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/commuting-square-control

jobs:
  square:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Build commuting square
        run: |
          mkdir -p "$OUT_DIR"
          PYTHONPATH=tools python - <<'PY'
          import json,os
          from pathlib import Path
          from hn_exact import K2,ONE,Z0,unit_modulus
          from hn_closed_copy_assembly import build_ring,discover_exact_cross_edges
          from hn_linked_closed_orbits import pack
          from hn_three_orbit_network import rational_unit_rotation
          from hn_unconditional_scan import write_json
          root=Path(os.environ['OUT_DIR']); d=json.loads(Path('upstream/handoff/data/g510_k2.json').read_text())
          bp=[K2(p['a'],p['b'],p['den']) for p in d['pts']]; be=sorted({tuple(map(int,e)) for e in d['edges']})
          ring,inh,_=build_ring(bp,be,(95,101),3); re,_,_=discover_exact_cross_edges(ring,inh,3e-7); re=sorted(re)
          r1=rational_unit_rotation(1,3); r2=rational_unit_rotation(1,5); s1=ring[0]-r1*ring[911]
          x=ONE-r1; assert all(v==0 for v in x.a[1:]+x.b[1:]); aa=x.a[0]; bb=x.b[0]
          ia=Z0[:]; ib=Z0[:]; ia[0]=x.den*aa; ib[0]=-x.den*bb
          inv=K2(ia,ib,aa*aa+11*bb*bb); assert (x*inv).is_one()
          s2=(ONE-r2)*inv*s1
          assert r1*s2+s1==r2*s1+s2
          A=list(ring); B=[r1*p+s1 for p in ring]; C=[r2*p+s2 for p in ring]; D=[r1*(r2*p+s2)+s1 for p in ring]
          copies={'A':A,'B':B,'C':C,'D':D}; index={}; pts=[]; maps={}; inherited=set()
          for name,cp in copies.items():
              m=[]
              for p in cp:
                  j=index.get(p)
                  if j is None: j=len(pts); index[p]=j; pts.append(p)
                  m.append(j)
              maps[name]=m
              for u,v in re:
                  x0,y0=m[u],m[v]
                  if x0!=y0: inherited.add((min(x0,y0),max(x0,y0)))
          edges,added,proposal=discover_exact_cross_edges(pts,inherited,3e-7)
          assert all(unit_modulus(pts[u]-pts[v]) for u,v in edges)
          sets={k:set(v) for k,v in maps.items()}; pair_counts={}
          names=['A','B','C','D']
          for i in range(4):
              for j in range(i+1,4):
                  xname,yname=names[i],names[j]; xs,ys=sets[xname],sets[yname]; c=0
                  for u,v in added:
                      if (u in xs and v in ys) or (v in xs and u in ys): c+=1
                  pair_counts[xname+yname]=c
          sel={'vertices':len(pts),'inherited_edges':len(inherited),'added_cross_edges':len(added),'screen_edges':len(edges),'pair_cross_counts':pair_counts,'float_proposal':proposal,'r1':pack(r1),'r2':pack(r2),'s1':pack(s1),'s2':pack(s2),'commutes_exactly':True}
          graph={'pts':[pack(p) for p in pts],'edges':[list(e) for e in sorted(edges)],'construction':'four closed rings in a commuting r(1/3),r(1/5) square','all_saved_edges_exact_unit':True,'induced_unit_edge_completion_pending':True}
          write_json(root/'SELECTED.json',{'selection':sel}); write_json(root/'SELECTED_GRAPH.json',graph); print(json.dumps(sel,indent=2))
          PY
      - name: Exact all-pairs completion
        run: |
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/SELECTED_GRAPH.json" --out "$OUT_DIR/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/POINTS.txt" > "$OUT_DIR/EXACT_EDGES.txt" 2> "$OUT_DIR/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/SELECTED_GRAPH.json" --edges "$OUT_DIR/EXACT_EDGES.txt" --out-dir "$OUT_DIR"
      - name: Validated 5-color probe
        run: |
          PYTHONPATH=tools python tools/hn_symmetry_sat_probe.py --graph "$OUT_DIR/COMPLETED_GRAPH.json" --out-dir "$OUT_DIR/seed" --conflicts 5000000 --attempts 10 --seed 2026091481
      - name: Pair separation if SAT
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); seed=root/'seed/SYMMETRY_SAT.json'; d=json.loads(seed.read_text())
          if d.get('status')!='SAT': print('no SAT seed; skip B scan'); sys.exit(0)
          cmd=[sys.executable,'tools/hn_local_pair_separation.py','--graph',str(root/'COMPLETED_GRAPH.json'),'--seed-coloring',str(seed),'--out-dir',str(root/'separation'),'--seconds','2400','--pair-seconds','15','--iterations','700000','--perturb','36','--max-failures','36','--seed','2026091482']
          env=dict(os.environ); env['PYTHONPATH']='tools'; subprocess.run(cmd,check=True,env=env)
          PY
      - name: Summarize
        if: always()
        run: |
          cp "$OUT_DIR/separation/SEPARATION.json" "$OUT_DIR/SEPARATION.json" 2>/dev/null || true
          cp "$OUT_DIR/separation/WITNESSES.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); lines=['# Commuting four-orbit square control — 2026-09-14','']
          for label,name in [('selection','SELECTED.json'),('geometry','GEOMETRY.json'),('seed','seed/SYMMETRY_SAT.json'),('separation','SEPARATION.json')]:
              p=root/name
              if p.exists():
                  d=json.loads(p.read_text()); slim={k:v for k,v in d.items() if k not in ('colors','records','remaining_blocks','compressed_source_indices')}; lines += [f'## {label}','```json',json.dumps(slim,indent=2),'```','']
          lines += ['The two affine rotations commute exactly. Only literal exact unit edges are constraints; final point set receives all-pairs exact completion.']
          (root/'SUMMARY.md').write_text('\n'.join(lines)+'\n'); print((root/'SUMMARY.md').read_text())
          PY
      - name: Commit compact checkpoint
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "$OUT_DIR/SUMMARY.md" "$OUT_DIR/SELECTED.json" "$OUT_DIR/GEOMETRY.json" "$OUT_DIR/seed/SYMMETRY_SAT.json" "$OUT_DIR/SEPARATION.json" "$OUT_DIR/WITNESSES.json" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Store commuting-square control'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-commuting-square-control-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          retention-days: 30
