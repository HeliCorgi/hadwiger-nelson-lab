name: hn-palette-directed-frontier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-palette-directed-frontier.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: p1q7-residual-sat-input-34853416283
          path: /tmp/input
          run-id: 34853416283
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          name: palette-layer400-all-34882939861
          path: /tmp/all400
          run-id: 34882939861
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan full p+d language for fresh exact killers
        run: |
          mkdir -p /tmp/frontier
          PYTHONPATH=tools python tools/hn_palette_directed_frontier.py \
            --base-graph /tmp/input/COMPLETED_GRAPH.json \
            --existing-graph /tmp/all400/build/GRAPH.json \
            --coloring /tmp/all400/repair/COLORING.txt \
            --direction-vertices 1192 \
            --pool-limit 1200 \
            --select-count 160 \
            --out-dir /tmp/frontier
      - name: Build exact augmented graph from all400 escape projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('/tmp/all400/repair/COLORING.txt').read_text().strip(); assert len(s)>=9369
          Path('/tmp/WITNESSES.json').write_text(json.dumps({'models':[[int(x) for x in s[:9369]]]},separators=(',',':'))+'\n')
          PY
          mkdir -p /tmp/build
          PYTHONPATH=tools python tools/hn_palette_layer_build.py \
            --graph /tmp/input/COMPLETED_GRAPH.json \
            --library /tmp/frontier/CENTER_LIBRARY.json \
            --tag all \
            --witnesses /tmp/WITNESSES.json \
            --out-dir /tmp/build
      - uses: actions/upload-artifact@v7
        with:
          name: palette-directed-frontier-input-${{ github.run_id }}
          path: |
            /tmp/frontier
            /tmp/build
          retention-days: 30

  repair:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-directed-frontier-input-${{ github.run_id }}
          path: /tmp/run
      - name: Unrestricted repair
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_seeded_tabucol.py \
            --graph /tmp/run/build/GRAPH.json \
            --seed-coloring /tmp/run/build/SEED.txt \
            --seconds 9000 \
            --restarts 60 \
            --iterations 7000000 \
            --perturb 60 \
            --seed 20260915160 \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-directed-frontier-repair-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30

  sat:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        solver: [cadical195, glucose4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-directed-frontier-input-${{ github.run_id }}
          path: /tmp/run
      - name: Full exact 5-color SAT
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_full_sat_probe.py \
            --graph /tmp/run/build/GRAPH.json \
            --solver '${{ matrix.solver }}' \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-directed-frontier-${{ matrix.solver }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
