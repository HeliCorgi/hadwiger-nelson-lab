name: separator-left-q0-side-relation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-q0-side-relation.yml'
      - 'tools/separator_left_q0_side_relation.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_q0_side_relation.py
      - name: Analyze q0-side relation graph
        run: |
          mkdir -p results/separator-left-q0-side-relation
          python tools/separator_left_q0_side_relation.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-q0-side-relation/analysis.json
      - name: Write summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/separator-left-q0-side-relation/analysis.json').read_text())
          lines=['# q0-side three-state relation','',
                 f"- q0-side states: `{d['extendable_states']}`",
                 f"- minimum pairwise disequality basis size: **{d['minimum_pairwise_basis_size']}**",
                 f"- separator equality-class sizes: `{ {k:len(v) for k,v in d['separator_equality_classes_q0_side'].items()} }`",
                 f"- all required disequalities explained by equality classes plus an ordinary edge: **{d['all_required_neq_explained_by_eq_classes_plus_edge']}**",'']
          for r in d['relation_explanations']:
              lines.append(f"- `{r['qnodes'][0]} != {r['qnodes'][1]}`: direct={r['direct_edge']}; class-edge witnesses `{r['class_edge_witnesses'][:6]}`")
          Path('results/separator-left-q0-side-relation/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-q0-side-relation
          if ! git diff --cached --quiet; then
            git commit -m 'Record q0-side relation analysis [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-q0-side-relation-${{ github.run_id }}
          path: results/separator-left-q0-side-relation
          if-no-files-found: error
          retention-days: 30
