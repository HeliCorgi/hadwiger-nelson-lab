name: hn-palette-conflict-edge-frontier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-palette-conflict-edge-frontier.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-layer1200-input-34887160185
          path: /tmp/base
          run-id: 34887160185
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          name: palette-layer1200-repair-34887160185
          path: /tmp/repair
          run-id: 34887160185
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fresh coupled conflict-edge frontier
        run: |
          mkdir -p /tmp/build
          PYTHONPATH=tools python tools/hn_palette_conflict_edge_frontier.py \
            --graph /tmp/base/GRAPH.json \
            --coloring /tmp/repair/COLORING.txt \
            --base-vertices 9369 \
            --direction-vertices 1192 \
            --out-dir /tmp/build
      - uses: actions/upload-artifact@v7
        with:
          name: palette-conflict-edge-frontier-input-${{ github.run_id }}
          path: /tmp/build
          retention-days: 30

  repair:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-conflict-edge-frontier-input-${{ github.run_id }}
          path: /tmp/build
      - name: Unrestricted repair
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_seeded_tabucol.py \
            --graph /tmp/build/GRAPH.json \
            --seed-coloring /tmp/build/SEED.txt \
            --seconds 9000 \
            --restarts 80 \
            --iterations 8000000 \
            --perturb 70 \
            --seed 202609150813 \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-conflict-edge-frontier-repair-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30

  sat:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        solver: [cadical195, glucose4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-conflict-edge-frontier-input-${{ github.run_id }}
          path: /tmp/build
      - name: Full exact 5-color SAT
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_full_sat_probe.py \
            --graph /tmp/build/GRAPH.json \
            --solver '${{ matrix.solver }}' \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-conflict-edge-frontier-${{ matrix.solver }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
