name: hn-palette-wide494-near31-adaptive-lns

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-palette-wide494-near31-adaptive-lns.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-wide494-input-34895797863
          path: /tmp/wide
          run-id: 34895797863
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and validate near-31 seed
        run: |
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          z=Path('results/unconditional-2026-09-14/palette-coupling/WIDE494_NEAR31.txt.gz.b64').read_text().strip()
          s=gzip.decompress(base64.b64decode(z)).decode().strip()
          g=json.loads(Path('/tmp/wide/GRAPH.json').read_text())
          assert len(s)==len(g['pts'])==11473
          bad=[e for e in g['edges'] if s[e[0]]==s[e[1]]]
          assert len(bad)==31
          Path('/tmp/NEAR31.txt').write_text(s+'\n')
          PY
      - name: Adaptive component-wise exact LNS
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_adaptive_lns_repair.py \
            --graph /tmp/wide/GRAPH.json \
            --seed-coloring /tmp/NEAR31.txt \
            --rounds 8 \
            --conflicts 12000000 \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-wide494-near31-adaptive-lns-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
