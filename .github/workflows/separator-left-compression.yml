name: separator-left-compression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-compression.yml'
      - 'tools/separator_left_compression.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: separator-left-compression
  cancel-in-progress: false

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout pinned upstream
        uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and sanity-check graph coloring helper
        run: |
          python -m py_compile tools/separator_left_compression.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from separator_left_compression import is_k_colorable
          K4=[(0,1),(0,2),(0,3),(1,2),(1,3),(2,3)]
          assert not is_k_colorable(range(4), K4, 3)
          assert is_k_colorable(range(4), K4, 4)
          C5=[(0,1),(1,2),(2,3),(3,4),(4,0)]
          assert is_k_colorable(range(5), C5, 3)
          print('colorability helper sanity OK')
          PY

      - name: Analyze p-side boundary compression
        run: |
          mkdir -p results/separator-left-compression
          python tools/separator_left_compression.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-compression/analysis.json

      - name: Write summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('results/separator-left-compression/analysis.json')
          d=json.loads(p.read_text())
          lines=[
            '# Separator left-side compression', '',
            f"- left states: **{', '.join(d['left_extendable_states'])}**",
            f"- minimum pairwise relation basis size: **{d['minimum_pairwise_relation_basis_size']}**",
            f"- number of minimum bases: **{d['minimum_pairwise_relation_basis_count']}**",
            f"- boundary induced edges: `{d['boundary_induced_edges']}`",
            '', '## Forced-equality local witnesses', ''
          ]
          for w in d['forced_equal_common_neighborhood_witnesses']:
              lines.append(f"- pair `{w['pair']}`: common-neighborhood size {w['common_neighbor_count']}; not-3-colorable={w['common_neighborhood_not_3_colorable']}; witness={w.get('minimal_vertex_witness')}; K4={w.get('minimal_witness_is_K4')}")
          text='\n'.join(lines)+'\n'
          Path('results/separator-left-compression/SUMMARY.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(text)
          print(text)
          PY

      - name: Commit result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-compression
          if ! git diff --cached --quiet; then
            git commit -m 'Record separator left-compression analysis [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: separator-left-compression-${{ github.run_id }}
          path: results/separator-left-compression
          if-no-files-found: error
          retention-days: 30
