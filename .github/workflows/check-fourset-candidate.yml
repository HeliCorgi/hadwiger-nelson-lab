name: check-fourset-candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/check_fourset_candidate.py'
      - '.github/workflows/check-fourset-candidate.yml'

permissions:
  contents: write

concurrency:
  group: check-fourset-candidate
  cancel-in-progress: false

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  RESULT: results/fourset-candidate-check/analysis.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout pinned upstream handoff
        uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and run independent candidate check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          python -m py_compile tools/check_fourset_candidate.py
          python tools/check_fourset_candidate.py \
            --data-dir upstream/handoff/data \
            --result "$RESULT" \
            --support 26 316 398 409

      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT"
          if ! git diff --cached --quiet; then
            git commit -m 'Record four-set semantic oracle check [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fourset-candidate-check-${{ github.run_id }}
          path: results/fourset-candidate-check
          if-no-files-found: warn
          retention-days: 30
