name: separator-left-unsat-cores

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-unsat-cores.yml'
      - 'tools/separator_left_unsat_cores.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: separator-left-unsat-cores
  cancel-in-progress: false

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_unsat_cores.py
      - name: Extract assumption cores
        run: |
          mkdir -p results/separator-left-unsat-cores
          timeout --signal=TERM --kill-after=30s 3000s \
            python tools/separator_left_unsat_cores.py \
              --data-dir upstream/handoff/data \
              --out results/separator-left-unsat-cores/analysis.json
      - name: Write summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('results/separator-left-unsat-cores/analysis.json').read_text())
          lines=['# Separator left assumption cores','']
          for x in d['pair_cores']:
              k=f"{x['pair'][0]}-{x['pair'][1]}"
              lines.append(f"- `{k}`: raw assumption core **{x['raw_assumption_core_size']}**, deletion-minimal **{x['minimal_vertex_count']} vertices / {x['minimal_edge_count']} edges**, independently verified={x['verification']['verified_forced_equal']}")
          s=d['shared_core']; g=d['tracked_contracted_graph']
          lines += ['',f"- shared three-equality core: **{s['vertex_count']} vertices / {s['edge_count']} edges**",f"- contracted tracked graph is K4 minus one edge: **{g['is_K4_minus_one_edge']}**",f"- missing class edge: `{g['missing_edges']}`"]
          text='\n'.join(lines)+'\n'; Path('results/separator-left-unsat-cores/SUMMARY.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          print(text)
          PY
      - name: Commit result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-unsat-cores
          if ! git diff --cached --quiet; then
            git commit -m 'Record separator equality assumption cores [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-unsat-cores-${{ github.run_id }}
          path: results/separator-left-unsat-cores
          if-no-files-found: warn
          retention-days: 30
