name: hn-palette-wide494

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-palette-wide494.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-conflict-edge-trace-34895252857
          path: /tmp/trace
          run-id: 34895252857
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build 494-direction wide targeted layer
        run: |
          mkdir -p /tmp/build
          PYTHONPATH=tools python tools/hn_palette_wide_frontier.py \
            --graph /tmp/trace/round-1-build/GRAPH.json \
            --coloring /tmp/trace/round-1-repair/COLORING.txt \
            --base-vertices 9369 \
            --direction-vertices 9369 \
            --out-dir /tmp/build
      - uses: actions/upload-artifact@v7
        with:
          name: palette-wide494-input-${{ github.run_id }}
          path: /tmp/build
          retention-days: 30

  repair:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-wide494-input-${{ github.run_id }}
          path: /tmp/build
      - name: Unrestricted repair
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_seeded_tabucol.py \
            --graph /tmp/build/GRAPH.json \
            --seed-coloring /tmp/build/SEED.txt \
            --seconds 14400 \
            --restarts 100 \
            --iterations 12000000 \
            --perturb 90 \
            --seed 20260915494 \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-wide494-repair-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30

  sat:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        solver: [cadical195, glucose4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: palette-wide494-input-${{ github.run_id }}
          path: /tmp/build
      - name: Full exact 5-color SAT
        run: |
          mkdir -p /tmp/out
          PYTHONPATH=tools python tools/hn_full_sat_probe.py \
            --graph /tmp/build/GRAPH.json \
            --solver '${{ matrix.solver }}' \
            --out-dir /tmp/out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: palette-wide494-${{ matrix.solver }}-${{ github.run_id }}
          path: /tmp/out
          retention-days: 30
