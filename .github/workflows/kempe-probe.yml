name: kempe-probe
on:
  push:
    branches: [research/quotient-critical]
    paths:
      - '.github/workflows/kempe-probe.yml'
      - 'tools/kempe_probe.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kempe-probe
  cancel-in-progress: false
env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/quotient-critical
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/kempe_probe.py
      - name: Sample quotient colorings and Kempe channels
        run: |
          mkdir -p results/kempe-probe
          timeout --signal=TERM --kill-after=30s 3000s python tools/kempe_probe.py \
            --data-dir upstream/handoff/data \
            --out results/kempe-probe/analysis.json \
            --models 300
      - name: Commit result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/kempe-probe/analysis.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Kempe-chain backbone probe [skip ci]'
            git pull --rebase origin research/quotient-critical
            git push origin HEAD:research/quotient-critical
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kempe-probe-${{ github.run_id }}
          path: results/kempe-probe
          if-no-files-found: error
          retention-days: 30
