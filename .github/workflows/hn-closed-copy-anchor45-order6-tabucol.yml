name: hn-closed-copy-anchor45-order6-tabucol

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-closed-copy-anchor45-order6-tabucol.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/closed-copy-anchor45-order6-tabucol

jobs:
  tabucol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Build candidate
        run: |
          PYTHONPATH=tools python tools/hn_closed_copy_direct.py \
            --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT_DIR" \
            --order 6 --anchor 45,173
      - name: Exact all-pairs completion
        run: |
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/SELECTED_GRAPH.json" --out "$OUT_DIR/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/POINTS.txt" > "$OUT_DIR/EXACT_EDGES.txt" 2> "$OUT_DIR/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/SELECTED_GRAPH.json" --edges "$OUT_DIR/EXACT_EDGES.txt" --out-dir "$OUT_DIR"
      - name: Validated local 5-color witness search
        run: |
          PYTHONPATH=tools python tools/hn_tabucol.py \
            --graph "$OUT_DIR/COMPLETED_GRAPH.json" --out-dir "$OUT_DIR/tabucol" \
            --seconds 600 --restarts 12 --iterations 1000000 --seed 20260914
      - name: Summarize
        if: always()
        run: |
          cp "$OUT_DIR/tabucol/TABUCOL.json" "$OUT_DIR/TABUCOL.json" 2>/dev/null || true
          cp "$OUT_DIR/tabucol/COLORING.txt" "$OUT_DIR/COLORING.txt" 2>/dev/null || true
          echo '# Closed copy anchor45 order6 TabuCol — 2026-09-14' > "$OUT_DIR/SUMMARY.md"
          cat "$OUT_DIR/GEOMETRY.json" >> "$OUT_DIR/SUMMARY.md" 2>/dev/null || true
          cat "$OUT_DIR/TABUCOL.json" >> "$OUT_DIR/SUMMARY.md" 2>/dev/null || true
          cat "$OUT_DIR/SUMMARY.md"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-closed-copy-anchor45-order6-tabucol-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30
