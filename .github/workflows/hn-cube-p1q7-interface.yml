name: hn-cube-p1q7-interface

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-cube-p1q7-interface.yml'
  workflow_dispatch:

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346
  OUT_DIR: results/unconditional-2026-09-14/cube-p1q7-interface

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Build square, cube, and shared layer map
        run: |
          mkdir -p "$OUT_DIR/cube"
          PYTHONPATH=tools python tools/hn_commuting_cube_geometry.py --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT_DIR/cube" --p 1 --q 7
          PYTHONPATH=tools python - <<'PY'
          import json,os
          from pathlib import Path
          from hn_exact import K2,ONE,unit_modulus
          from hn_closed_copy_assembly import build_ring,discover_exact_cross_edges
          from hn_three_orbit_network import rational_unit_rotation
          from hn_commuting_cube_geometry import inv_subfield,transform
          from hn_linked_closed_orbits import pack
          from hn_unconditional_scan import write_json
          root=Path(os.environ['OUT_DIR']); d=json.loads(Path('upstream/handoff/data/g510_k2.json').read_text())
          bp=[K2(x['a'],x['b'],x['den']) for x in d['pts']]; be=sorted({tuple(map(int,e)) for e in d['edges']})
          ring,inh,_=build_ring(bp,be,(95,101),3); re,_,_=discover_exact_cross_edges(ring,inh,3e-7); re=sorted(re)
          r1=rational_unit_rotation(1,3); r2=rational_unit_rotation(1,5); r3=rational_unit_rotation(1,7); s1=ring[0]-r1*ring[911]; center=inv_subfield(ONE-r1)*s1
          sq_rots=[ONE,r1,r2,r1*r2]; index={}; pts=[]; inherited=set()
          for r in sq_rots:
              m=[]
              for p in transform(ring,r,center):
                  j=index.get(p)
                  if j is None: j=len(pts); index[p]=j; pts.append(p)
                  m.append(j)
              for u,v in re:
                  x,y=m[u],m[v]
                  if x!=y: inherited.add((min(x,y),max(x,y)))
          edges,_,_=discover_exact_cross_edges(pts,inherited,3e-7); assert len(pts)==4742 and len(edges)==28459 and all(unit_modulus(pts[u]-pts[v]) for u,v in edges)
          write_json(root/'SQUARE.json',{'pts':[pack(p) for p in pts],'edges':[list(e) for e in sorted(edges)]})
          cube=json.loads((root/'cube/SELECTED_GRAPH.json').read_text()); cpts=[K2(p['a'],p['b'],p['den']) for p in cube['pts']]; cindex={p:i for i,p in enumerate(cpts)}
          assert cpts[:4742]==pts
          tmap=[cindex[r3*p+(ONE-r3)*center] for p in pts]; shared=sum(1 for j in tmap if j<4742); assert shared==115
          write_json(root/'LAYER_MAP.json',{'lower_n':4742,'t3map':tmap,'shared_vertices':shared})
          PY
      - name: Exact-complete cube
        run: |
          g++ -O3 -std=c++17 tools/hn_exact_completion.cpp -o /tmp/hn_exact_completion
          python tools/hn_exact_complete_io.py prepare --graph "$OUT_DIR/cube/SELECTED_GRAPH.json" --out "$OUT_DIR/cube/POINTS.txt"
          /tmp/hn_exact_completion < "$OUT_DIR/cube/POINTS.txt" > "$OUT_DIR/cube/EXACT_EDGES.txt" 2> "$OUT_DIR/cube/EXACT_COMPLETION.log"
          python tools/hn_exact_complete_io.py finish --graph "$OUT_DIR/cube/SELECTED_GRAPH.json" --edges "$OUT_DIR/cube/EXACT_EDGES.txt" --out-dir "$OUT_DIR/cube"
      - name: Probe 223 lower witnesses against upper square
        run: |
          PYTHONPATH=tools python tools/hn_square_interface_probe.py \
            --square "$OUT_DIR/SQUARE.json" --cube "$OUT_DIR/cube/COMPLETED_GRAPH.json" \
            --layer-map "$OUT_DIR/LAYER_MAP.json" \
            --witnesses results/unconditional-2026-09-14/commuting-square-control/WITNESSES.json \
            --out-dir "$OUT_DIR/probe"
      - name: Repair interface coloring on full cube when available
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); p=root/'probe/COLORING_SEED.txt'
          if not p.exists(): print('no compatible square pair in finite witness family'); sys.exit(0)
          r=json.loads((root/'probe/INTERFACE.json').read_text())
          if r.get('best_cube_conflicts')==0: print('already full proper cube coloring'); sys.exit(0)
          cmd=[sys.executable,'tools/hn_seeded_tabucol.py','--graph',str(root/'cube/COMPLETED_GRAPH.json'),'--seed-coloring',str(p),'--out-dir',str(root/'repair'),'--seconds','1200','--restarts','18','--iterations','1800000','--perturb','50','--seed','2026091497']
          env=dict(os.environ); env['PYTHONPATH']='tools'; subprocess.run(cmd,check=True,env=env)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hn-cube-p1q7-interface-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          retention-days: 30
