name: separator-left-q18-forbidden-state-core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separator-left-q18-forbidden-state-core.yml'
      - 'tools/separator_left_q18_forbidden_state_core.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/separator_left_q18_forbidden_state_core.py
      - name: Extract forbidden-state core
        run: |
          mkdir -p results/separator-left-q18-forbidden-state-core
          python tools/separator_left_q18_forbidden_state_core.py \
            --data-dir upstream/handoff/data \
            --out results/separator-left-q18-forbidden-state-core/analysis.json
      - name: Write summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/separator-left-q18-forbidden-state-core/analysis.json').read_text())
          b=d['best_core']
          lines=['# q18-side unique forbidden state core','',
                 f"- five common pairwise disequalities: `{d['five_common_pairwise_disequalities']}`",
                 f"- these alone allow 9 states: `{d['states_satisfying_only_those_disequalities']}`",
                 f"- unique extra state rejected by q18 side: **{d['unique_extra_state']}**",
                 f"- full-side forbidden-state SAT checks: `{d['forbidden_state_full_side_sat']}`",
                 f"- nearby valid control `{d['valid_control_state']}` SAT checks: `{d['valid_control_full_side_sat']}`",
                 f"- raw assumption core: **{d['raw_assumption_core_size']} vertices**",
                 f"- best inclusion-minimal core: **{b['vertex_count']} vertices / {b['edge_count']} edges** ({b['order']})",
                 f"- best core cross-check: forbidden CaDiCaL/Glucose={b['forbidden_sat_cadical195']}/{b['forbidden_sat_glucose4']}; control={b['valid_control_sat_cadical195']}/{b['valid_control_sat_glucose4']}"]
          Path('results/separator-left-q18-forbidden-state-core/SUMMARY.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/separator-left-q18-forbidden-state-core
          if ! git diff --cached --quiet; then
            git commit -m 'Record q18 forbidden-state core [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: separator-left-q18-forbidden-state-core-${{ github.run_id }}
          path: results/separator-left-q18-forbidden-state-core
          if-no-files-found: error
          retention-days: 30
