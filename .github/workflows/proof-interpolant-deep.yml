name: proof-interpolant-deep

on:
  push:
    branches: [research/proof-structure]
    paths:
      - '.github/workflows/proof-interpolant-deep.yml'
      - 'tools/proof_interpolant_deep.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-interpolant-deep
  cancel-in-progress: false

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  RESULT_DIR: results/proof-interpolant-deep

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/proof-structure
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile tools/proof_interpolant_deep.py
      - name: Mine size 4-6 proof supports and test exact symmetric projections
        run: |
          mkdir -p "$RESULT_DIR"
          timeout --signal=TERM --kill-after=60s 6600s \
            python tools/proof_interpolant_deep.py \
              --data-dir upstream/handoff/data \
              --out-dir "$RESULT_DIR" \
              --min-size 4 \
              --max-size 6 \
              --per-size 180
      - name: Commit compact results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR/DEEP_SUMMARY.json" "$RESULT_DIR/deep_interpolant.json"
          if ! git diff --cached --quiet; then
            git commit -m 'Record deep proof-guided interpolant probe [skip ci]'
            git pull --rebase origin research/proof-structure
            git push origin HEAD:research/proof-structure
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-interpolant-deep-${{ github.run_id }}
          path: results/proof-interpolant-deep
          if-no-files-found: error
          retention-days: 30
