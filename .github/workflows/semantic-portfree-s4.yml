name: semantic-portfree-s4

on:
  push:
    branches:
      - research/semantic-interface
    paths:
      - '.github/workflows/semantic-portfree-s4.yml'
      - 'tools/semantic_cegis_portfree.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-portfree-s4
  cancel-in-progress: false

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  CHECKPOINT: checkpoints/semantic_portfree_s4.json.gz
  RESULT_DIR: results/semantic-portfree-s4

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v7
        with:
          ref: research/semantic-interface
          fetch-depth: 0

      - name: Checkout pinned upstream handoff
        uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - name: Verify upstream pin
        run: test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install solver dependencies
        run: pip install -r requirements.txt

      - name: Compile and smoke-test decision budgets
        shell: bash
        run: |
          python -m py_compile tools/semantic_cegis_portfree.py
          python - <<'PY'
          from pysat.solvers import Cadical195
          with Cadical195(bootstrap_with=[[1]]) as s:
              s.dec_budget(1000)
              assert s.solve_limited() is True
              s.dec_budget(-1)
          print('Cadical195 decision-budget smoke test: OK')
          PY

      - name: Preflight checkpoint compatibility
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hn-preflight
          mkdir -p /tmp/hn-preflight/results
          cp "$CHECKPOINT" /tmp/hn-preflight/checkpoint.json.gz
          set +e
          timeout --signal=TERM --kill-after=30s 180s \
            python tools/semantic_cegis_portfree.py \
              --data-dir upstream/handoff/data \
              --checkpoint /tmp/hn-preflight/checkpoint.json.gz \
              --result-dir /tmp/hn-preflight/results \
              --time-limit-sec 60 \
              --checkpoint-every 1 \
              --query-decision-budget 100000 \
              --max-query-decision-budget 100000 \
              --fast-search-sec 5 \
              --fast-restarts 8
          rc=$?
          set -e
          case "$rc" in
            0|75|124|137|143) ;;
            *) echo "preflight failed with exit code: $rc"; exit "$rc" ;;
          esac
          gzip -t /tmp/hn-preflight/checkpoint.json.gz

      - name: Run guarded hybrid slices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints "$RESULT_DIR"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for slice in 1 2 3 4 5 6; do
            if [[ -f "$RESULT_DIR/FINAL.json" || -f "$RESULT_DIR/INTERFACE.json" ]]; then
              echo "terminal result already present before slice $slice"
              break
            fi

            echo "=== hybrid search slice $slice / 6 ==="
            set +e
            timeout --signal=TERM --kill-after=60s 3000s \
              python tools/semantic_cegis_portfree.py \
                --data-dir upstream/handoff/data \
                --checkpoint "$CHECKPOINT" \
                --result-dir "$RESULT_DIR" \
                --time-limit-sec 2700 \
                --checkpoint-every 1 \
                --query-decision-budget 2000000 \
                --max-query-decision-budget 16000000 \
                --fast-search-sec 20 \
                --fast-restarts 48
            rc=$?
            set -e

            # 0: terminal result; 75: sound nonterminal continuation state;
            # 124/137/143: outer timeout/termination. None is SAT/UNSAT evidence.
            case "$rc" in
              0|75|124|137|143) ;;
              *) echo "unexpected search exit code: $rc"; exit "$rc" ;;
            esac

            gzip -t "$CHECKPOINT"

            git add checkpoints results
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint hybrid support-4 search slice $slice [skip ci]"
              git pull --rebase origin research/semantic-interface
              git push origin HEAD:research/semantic-interface
            fi

            if [[ -f "$RESULT_DIR/FINAL.json" || -f "$RESULT_DIR/INTERFACE.json" ]]; then
              echo "terminal result produced in slice $slice"
              break
            fi
          done

      - name: Upload latest search state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-portfree-s4-${{ github.run_id }}
          path: |
            checkpoints/semantic_portfree_s4.json.gz
            results/semantic-portfree-s4
          if-no-files-found: error
          retention-days: 30
