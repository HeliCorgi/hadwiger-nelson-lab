name: hn-three-orbit-rotation-portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hn-three-orbit-rotation-portfolio.yml'
      - 'tools/hn_three_orbit_rotation_geometry.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_SHA: d1e80998bda337d9fa721f2e96d203ae54e97fc8
  G510_SHA256: 0248fe0c7fd2df06d818aee0c188a7b70362d5990c1ca39271fc057b7b898346

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { p: 1, q: 4, tag: p1q4 }
          - { p: 1, q: 5, tag: p1q5 }
          - { p: 2, q: 5, tag: p2q5 }
          - { p: 2, q: 7, tag: p2q7 }
          - { p: 2, q: 3, tag: p2q3 }
          - { p: 3, q: 5, tag: p3q5 }
          - { p: 3, q: 7, tag: p3q7 }
          - { p: 3, q: 8, tag: p3q8 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          repository: HeliCorgi/five-color-forcing-anatomy
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy==1.14.1
      - name: Verify pinned G510
        run: echo "$G510_SHA256  upstream/handoff/data/g510_k2.json" | sha256sum -c -
      - name: Scan exact two-sided coupling
        run: |
          OUT="results/unconditional-2026-09-14/three-orbit-rotation-portfolio/${{ matrix.tag }}"
          mkdir -p "$OUT"
          PYTHONPATH=tools python tools/hn_three_orbit_rotation_geometry.py \
            --graph upstream/handoff/data/g510_k2.json --out-dir "$OUT" \
            --c-p ${{ matrix.p }} --c-q ${{ matrix.q }} --pivot-count 6 \
            --seed 2026091450
      - uses: actions/upload-artifact@v7
        with:
          name: three-orbit-rotation-${{ matrix.tag }}-${{ github.run_id }}
          path: results/unconditional-2026-09-14/three-orbit-rotation-portfolio/${{ matrix.tag }}
          if-no-files-found: error
          retention-days: 30
